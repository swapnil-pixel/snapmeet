<!DOCTYPE html>
<html>
<head>
    <title>{{ user.username }}'s Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
        <h2>{{ user.username }}'s Profile</h2>
    </div>

    <div class="main-content">
        <p>Email: {{ user.email }}</p>

        <h3>Posts</h3>
        {% if posts %}
            {% for post in posts %}
                <div class="post">
                    <p>{{ post.content }}</p>
                    {% if post.image_filename %}
                        <img src="{{ url_for('static', filename='uploads/' + post.image_filename) }}" width="300">
                    {% endif %}
                    <hr>
                </div>
            {% endfor %}
        {% else %}
            <p>No posts yet.</p>
        {% endif %}
    </div>
</body>
</html>
