{% extends "base.html" %}
{% block title %}Edit Profile — SnapMeet{% endblock %}

{% block content %}
<div class="insta-container">
  <div class="create-post-card">
    <h3>Edit Profile</h3>
    <form method="POST" enctype="multipart/form-data">
      <div style="display:grid; gap:8px; margin-top:10px;">
        <input name="headline" placeholder="Headline" value="{{ profile.headline if profile else '' }}" />
        <textarea name="bio" placeholder="Bio" rows="4">{{ profile.bio if profile else '' }}</textarea>
        <input name="location" placeholder="Location" value="{{ profile.location if profile else '' }}" />
        <input name="college" placeholder="College" value="{{ profile.college if profile else '' }}" />
        <input name="graduation_year" placeholder="Graduation year" value="{{ profile.graduation_year if profile else '' }}" />
        <input name="skills" placeholder="Skills (comma separated)" value="{{ profile.skills if profile else '' }}" />
        <input name="website" placeholder="Website" value="{{ profile.website if profile else '' }}" />
        <label class="upload-label">Upload profile image
          <input id="profile-image-input" name="profile_image" type="file" accept="image/*" style="display:none;">
        </label>
        <div id="profile-preview" class="image-preview" style="display:none;">
          <img id="profile-preview-img" src="" alt="preview" style="height:80px;border-radius:8px;">
          <button id="clear-profile-preview" type="button" class="btn small">Remove</button>
        </div>

        <label class="upload-label">Upload resume
          <input name="resume" type="file" accept=".pdf,.doc,.docx" style="display:none;">
        </label>

        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn primary" type="submit">Save</button>
          <a class="btn" href="{{ url_for('view_profile_page', user_id=session['user_id']) }}">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>

{% block extra_js %}
<script> setupImagePreview('profile-image-input','profile-preview-img','profile-preview','clear-profile-preview'); </script>
{% endblock %}
{% endblock %}
