{% extends "base.html" %}
{% block title %}Friend Requests — SnapMeet{% endblock %}

{% block content %}
<div class="insta-container">

    <h2 class="req-title">Friend Requests</h2>

    {% if not requests %}
        <p class="muted center" style="margin-top:20px;">No pending requests 🎉</p>
    {% endif %}

    {% for req in requests %}
    <div class="req-card">

        <!-- Avatar -->
        <div class="req-avatar">
            {{ req.username[0]|upper }}
        </div>

        <!-- Info -->
        <div class="req-info">
            <div class="req-name">{{ req.username }}</div>
        </div>

        <!-- Accept Button -->
        <form method="POST" action="{{ url_for('accept_request', request_id=req.id) }}">
            <button class="btn small primary req-accept-btn">Accept</button>
        </form>

    </div>
    {% endfor %}

</div>
{% endblock %}
