<!-- templates/friend_requests.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Friend Requests</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('dashboard') }}" class="back-btn">← Back</a>
        <h2>👥 Friend Requests</h2>
    </div>

    <div class="content animated-section">
        {% if friend_requests %}
            {% for req in friend_requests %}
                <div class="card friend-card">
                    <p>📬 <strong>{{ req.username }}</strong> sent you a request!</p>
                    <form method="POST" action="/accept_request/{{ req.id }}">
                        <input type="submit" value="✅ Accept" class="accept-btn">
                    </form>
                </div>
            {% endfor %}
        {% else %}
            <div class="no-requests">
                <h3>🎉 You're all caught up!</h3>
                <p>No new friend requests. Enjoy exploring!</p>
                <img src="{{ url_for('static', filename='fun/no-requests.png') }}" alt="No requests" class="fun-img">
            </div>
        {% endif %}
    </div>
</body>
</html>
