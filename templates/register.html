<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SnapMeet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.4;
            animation: float 8s ease-in-out infinite;
        }
        .circle:nth-child(1) { width: 250px; height: 250px; background:#ffffff2b; top:10%; left:10%; animation-delay:0s; }
        .circle:nth-child(2) { width: 350px; height:350px; background:#ffffff20; bottom:10%; right:15%; animation-delay:2s; }

        @keyframes float { 0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)} }

        .register-container {
            position: relative;
            width: 380px;
            padding: 40px;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(31,38,135,0.37);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            color: #fff;
            animation: fadeIn 1.2s ease forwards;
        }

        @keyframes fadeIn { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

        h1 { text-align:center; margin-bottom:25px; }

        form { display:flex; flex-direction:column; }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"] {
            background: rgba(255,255,255,0.2);
            border:none;
            outline:none;
            margin:10px 0;
            padding:12px;
            border-radius:8px;
            color:#fff;
            font-size:15px;
        }
        form input::placeholder{color:#eee;}

        .register-btn {
            margin-top:15px;
            background:#3B82F6;
            border:none;
            padding:12px;
            border-radius:8px;
            color:#fff;
            font-weight:bold;
            cursor:pointer;
            transition:background 0.3s ease, transform 0.2s;
        }
        .register-btn:hover{background:#2563EB; transform:translateY(-2px);}

        .login-link{ text-align:center; margin-top:15px; }
        .login-link a{ color:#fff; text-decoration:underline; font-weight:500; }
        .login-link a:hover{ color:#dce5ff; }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff7675;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="register-container">
        <h1>Register</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="register-btn">Register</button>
        </form>
        <div class="login-link">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
    </div>
</body>
</html>
