{% extends "base.html" %}
{% block title %}Chat — {{ friend.username }}{% endblock %}

{% block content %}
<div class="insta-container">
  <div style="margin-bottom:10px;">
    <a href="{{ url_for('dashboard') }}" class="small-link">← Back to feed</a>
    <h3 style="display:inline-block; margin-left:12px;">Chat — {{ friend.username }}</h3>
  </div>

  <div class="chat-wrapper">
    <div class="chat-box" id="chat-box">
      {% for m in messages %}
        <div class="chat-message {{ 'sent' if m.sender_id==user_id else 'received' }}">
          <div class="bubble">
            <div><strong>{{ 'You' if m.sender_id==user_id else friend.username }}</strong></div>
            <div>{{ m.message }}</div>
            <span class="timestamp muted">{{ m.timestamp }}</span>
          </div>
        </div>
      {% endfor %}
    </div>

    <form method="POST" class="chat-form" style="margin-top:12px;">
      <textarea name="message" placeholder="Type a message..." required></textarea>
      <button class="send-btn" type="submit">Send</button>
    </form>

    <form action="{{ url_for('vanish_chat', friend_id=friend.id) }}" method="POST" style="margin-top:10px;">
      <button class="vanish-btn" onclick="return confirm('Vanish chat permanently?')">Vanish Chat</button>
    </form>
  </div>
</div>
{% endblock %}
