{% extends "base.html" %}
{% block title %}Search{% endblock %}

{% block content %}
<div class="insta-container">

  <h2 class="search-title">Search results for "{{ query }}"</h2>

  {% if not results %}
      <p class="muted center" style="margin-top:20px;">No users found 🙁</p>
  {% endif %}

  {% for user in results %}
  <div class="search-card">
      
      <!-- avatar -->
      <div class="search-avatar">
          {{ user.username[0]|upper }}
      </div>

      <!-- name -->
      <div class="search-info">
          <a href="{{ url_for('view_profile_page', user_id=user.id) }}" class="search-user-link">
              {{ user.username }}
          </a>
      </div>

      <!-- add friend button -->
      <form method="POST" action="{{ url_for('send_request', receiver_id=user.id) }}">
          <button class="btn small primary search-add-btn">Add</button>
      </form>

  </div>
  {% endfor %}

</div>
{% endblock %}
